<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Intake–Cascade PTO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one working bench. The CAD model and its controls on top, the shift explained underneath. */
:root {
  --bg: #edf0f1;
  --panel: #fafbfb;
  --ink: #13202a;
  --muted: #56656f;
  --line: #c9d2d7;
  --stage: #d9dfe2;
  --stage-2: #c4ccd0;
  --cascade: #b46b00;
  --intake: #00806f;
  --neutral: #6b7a84;
  --on-accent: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1418; --panel: #151e24; --ink: #e3eaee; --muted: #8e9da7; --line: #27343c;
    --stage: #1a2329; --stage-2: #0d1317; --cascade: #f0a43a; --intake: #2ec2ae; --neutral: #8a99a3; --on-accent: #0a1013;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1418; --panel: #151e24; --ink: #e3eaee; --muted: #8e9da7; --line: #27343c;
  --stage: #1a2329; --stage-2: #0d1317; --cascade: #f0a43a; --intake: #2ec2ae; --neutral: #8a99a3; --on-accent: #0a1013;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 22px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: grid; gap: 4px; margin-bottom: 16px; }
.eyebrow { font: 600 12px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 clamp(30px, 5vw, 46px)/1 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.lede { margin: 6px 0 0; max-width: 70ch; color: var(--muted); }
.lede b { color: var(--ink); font-weight: 600; }

.bench { display: grid; grid-template-columns: minmax(0, 1fr) 304px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .bench { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 600px) { .stage { aspect-ratio: 1 / 1.15; } .lbl.small { display: none; } .lbl { font-size: 10.5px; } }

.stage { position: relative; background: var(--stage); border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 10.5; min-height: 320px; max-width: 100%; border: 1px solid var(--line); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lbl { font: 500 11.5px/1.25 var(--body); color: var(--ink); background: color-mix(in srgb, var(--panel) 88%, transparent);
  border: 1px solid var(--line); padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
.lbl.small { font-size: 10.5px; color: var(--muted); }
.stage.hide-labels .labels { display: none; }
.hud { position: absolute; left: 12px; top: 12px; display: grid; gap: 4px; pointer-events: none; }
.chip { justify-self: start; font: 700 15px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 6px 10px 5px; border-radius: 4px;
  color: var(--on-accent); background: var(--neutral); transition: background-color .2s; }
.chip[data-mode="lift"] { background: var(--cascade); }
.chip[data-mode="intake"] { background: var(--intake); }
.hud-sub { font: 500 12px/1.3 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.views { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.views button, .play { font: 600 12px/1 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 10px; cursor: pointer; }
.views button[aria-pressed="true"] { border-color: var(--ink); }
.play { position: absolute; right: 12px; top: 12px; min-width: 70px; }
.msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); font: 500 14px/1.4 var(--body); pointer-events: none; }
.msg[hidden] { display: none; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 18px; }
.panel h2 { font: 700 13px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 700 17px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 12px 8px 10px; border: 0; cursor: pointer;
  background: transparent; color: var(--ink); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[data-mode="lift"][aria-pressed="true"] { background: var(--cascade); color: var(--on-accent); }
.seg button[data-mode="intake"][aria-pressed="true"] { background: var(--intake); color: var(--on-accent); }
.seg button small { display: block; font: 500 11px/1.2 var(--body); letter-spacing: 0; text-transform: none; margin-top: 5px; opacity: .85; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row label { font-weight: 500; }
.toggles { display: grid; gap: 8px; }
.toggles label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
input[type="range"] { width: 100%; accent-color: var(--ink); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.read { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 0; font-size: 14px; }
.read dt { color: var(--muted); }
.read dd { margin: 0; text-align: right; font: 500 13px/1.5 var(--mono); font-variant-numeric: tabular-nums; }
.read dd .tag { font: 600 10.5px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 2px 5px; border-radius: 3px; margin-left: 6px; border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; }
.read dd .tag.on-lift { border-color: var(--cascade); color: var(--cascade); }
.read dd .tag.on-intake { border-color: var(--intake); color: var(--intake); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.below { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px 28px; margin-top: 28px; }
@media (max-width: 900px) { .below { grid-template-columns: minmax(0, 1fr); } }
.below > div { min-width: 0; }
.below h2 { font: 700 22px/1.1 var(--display); letter-spacing: .02em; margin: 0 0 10px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); transition: border-color .2s; }
.steps li::before { content: counter(s); grid-row: span 2; font: 700 22px/1 var(--display); color: var(--muted); padding-top: 2px; }
.steps li b { font-weight: 600; }
.steps li span { color: var(--muted); grid-column: 2; }
.steps li.now { border-color: var(--ink); }
.steps li.now::before { color: var(--ink); }
.note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.train { display: grid; gap: 12px; }
.path { border-left: 3px solid var(--neutral); padding: 2px 0 2px 12px; }
.path.lift { border-color: var(--cascade); }
.path.intake { border-color: var(--intake); }
.path h3 { font: 700 16px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 4px; }
.path p { margin: 0; font: 500 12.5px/1.7 var(--mono); overflow-wrap: anywhere; }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 70ch; }
.notes li::marker { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .chip, .steps li { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Intake–Cascade PTO</h1>
  </header>

  <section class="bench">
    <div class="stage" id="stage">
      <div class="hud">
        <div class="chip" id="chip" data-mode="intake">Intake</div>
        <div class="hud-sub" id="hudsub">top roller 300 rpm</div>
      </div>
      <button class="play" id="play" type="button" aria-pressed="true">Pause</button>
      <div class="views" role="group" aria-label="Camera view">
        <button type="button" data-view="iso" aria-pressed="true">3D</button>
        <button type="button" data-view="side" aria-pressed="false">Along the shaft</button>
        <button type="button" data-view="face" aria-pressed="false">Gear plane</button>
      </div>
      <div class="msg" id="msg">Loading the CAD parts…</div>
    </div>

    <aside class="panel" aria-label="Controls">
      <div>
        <h2>Output</h2>
        <div class="seg" role="group" aria-label="PTO output">
          <button type="button" id="m-lift" data-mode="lift" aria-pressed="false">Cascade<small>cylinder extended</small></button>
          <button type="button" id="m-intake" data-mode="intake" aria-pressed="true">Intake<small>cylinder retracted</small></button>
        </div>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="auto" checked> Shift back and forth on its own</label>
        <label><input type="checkbox" id="lbls" checked> Part labels</label>
        <label><input type="checkbox" id="path"> Tint the parts carrying power</label>
        <label><input type="checkbox" id="ctx" checked> Towers and bracing</label>
      </div>
      <div>
        <div class="row"><label for="speed">Slow motion</label><span class="mono" id="speedv">0.10× real</span></div>
        <input type="range" id="speed" min="0.02" max="0.5" step="0.01" value="0.10">
      </div>
      <div>
        <h2>Live (real speeds)</h2>
        <dl class="read">
          <dt>Motor</dt><dd><span id="r-motor">100</span> rpm</dd>
          <dt>Cascade winch</dt><dd><span id="r-winch">0</span> rpm<span class="tag" id="t-winch">held</span></dd>
          <dt>Intake shaft</dt><dd><span id="r-ishaft">100</span> rpm</dd>
          <dt>Top roller</dt><dd><span id="r-roller">300</span> rpm<span class="tag on-intake" id="t-roller">driven</span></dd>
          <dt>Gear travel</dt><dd><span id="r-travel">0.000</span> / 0.984 in</dd>
          <dt>Cylinder</dt><dd id="r-cyl">retracted</dd>
        </dl>
      </div>
    </aside>
  </section>

</div>

}

function decode(buf, c, shift) {
  const q = new Uint16Array(buf, c.p, c.nv * 3);
  const pos = new Float32Array(c.nv * 3);
  for (let i = 0; i < c.nv; i++) for (let k = 0; k < 3; k++) {
    pos[i * 3 + k] = c.b0[k] + (q[i * 3 + k] / 65535) * (c.b1[k] - c.b0[k]) - (shift ? shift[k] : 0);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(new Int8Array(buf, c.n, c.nv * 3), 3, true));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array(buf, c.i, c.ni), 1));
  g.computeBoundingSphere();
  return g;
}

function build(buf) {
  for (const c of META.chunks) {
    if (c.unit === 'chainlink') {
      linkGeom = decode(buf, c, null);
      continue;
    }
    const u = unit(c.unit);
    const shift = u.ax ? [0, u.ax[0], u.ax[1]] : null;
    const g = decode(buf, c, shift);
    const m = new THREE.Mesh(g, matFor(c.unit, c.mat));
    m.castShadow = c.mat !== 'polycarb';
    m.receiveShadow = true;
    u.pivot.add(m); u.meshes.push(m);
    if (c.cat === 'struct') ctxMeshes.push(m);
    if (c.mat === 'polycarb') {
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(g, 30), new THREE.LineBasicMaterial({ color: 0x6f8fa3, transparent: true, opacity: 0.8 }));
      u.pivot.add(e); plateEdges = e;
    }
  }
  chainMesh = new THREE.InstancedMesh(linkGeom, matFor('chain', 'grey'), META.chain.n);
  chainMesh.castShadow = chainMesh.receiveShadow = true;
  chainMesh.frustumCulled = false;
  scene.add(chainMesh);
}

// ---------- labels ----------
function label(text, pos, cls = '', parent = scene, face = false) {
  const d = document.createElement('div');
  d.className = 'lbl ' + cls; d.textContent = text;
  const o = new CSS2DObject(d); o.position.set(...pos); parent.add(o);
  o.userData.face = face;
  allLabels.push(o);
  return o;
}
const NB = META.named;
const ctr = (k) => NB[k][0].map((v, i) => (v + NB[k][1][i]) / 2);
function addLabels() {
  const m = ctr('motor'); label('11W motor · red 100 rpm', [m[0], m[1], NB.motor[1][2] + 0.35]);
  const c = ctr('cyl'); label('25 mm cylinder', [c[0] + 0.6, c[1], NB.cyl[1][2] + 0.3]);
  const s = ctr('slider'); label('Sliding 36T', [s[0], s[1] - 0.95, s[2] - 0.55], '', unit('slider').outer, true);
  const r = ctr('rodend'); label('Rod end → standoff → fork', [r[0] - 0.2, r[1] - 0.6, r[2] + 0.35], 'small', unit('fork').outer);
  const w = ctr('w12'); label('12T on winch shaft (cascade)', [w[0], w[1] - 0.6, NB.w12[0][2] - 0.25], '', scene, true);
  const l = ctr('ls36'); label('36T on intake shaft', [l[0], l[1] - 0.95, NB.ls36[1][2] + 0.1], 'small', scene, true);
  const i = ctr('idl'); label('Chain to idler 36T', [i[0], i[1] + 0.4, NB.idl[1][2] + 0.25], 'small');
  const t = ctr('r12'); label('12T on top roller', [t[0] + 0.3, t[1] + 0.45, NB.r12[0][2] - 0.2], 'small');
  const p = ctr('plate'); label('Polycarbonate plate', [p[0], NB.plate[0][1] - 0.1, NB.plate[0][2] + 0.25], 'small');
  label('Right tower', [ctr('towerR')[0], 4.25, 13.1], 'small');
  label('Left tower', [ctr('towerL')[0], 4.25, 13.1], 'small');
}

// ---------- gear and chain kinematics ----------
const wrapP = (a, p) => a - p * Math.round(a / p);
const psi = (a, b) => Math.atan2(AX[b][1] - AX[a][1], AX[b][0] - AX[a][0]);
// tooth angle that gear B (NB teeth) needs so it meshes with gear A (NA teeth) whose tooth sits at thA
const meshTooth = (thA, NA, NBt, ps) => ps + PI + PI / NBt - (NA / NBt) * (thA - ps);
const PSI = { MI: psi('M', 'I'), MW: psi('M', 'W8'), WL: psi('W', 'L'), IR: psi('IDL', 'R'), RR2: psi('R', 'R2') };
const pitch = (g) => TAU / GE[g].N;

// chain path: two equal 8T sprockets (intake shaft I and idler IDL), pins on the pitch circle
const CH = META.chain, P6 = CH.pitch, NT = 8;
const RP = P6 / (2 * Math.sin(PI / NT));        // pitch radius
const REFF = NT * P6 / TAU;                      // chain travel per radian, one pitch per tooth
const C13 = AX.I, C14 = AX.IDL;
const dv = [C14[0] - C13[0], C14[1] - C13[1]], Ld = Math.hypot(...dv), uh = [dv[0] / Ld, dv[1] / Ld];
const right = [uh[1], -uh[0]], left = [-uh[1], uh[0]];
const SPAN = (CH.n * P6 - TAU * REFF) / 2;        // straight runs, sized so 33 links close the loop
const ARC = PI * REFF;
const aR = Math.atan2(right[1], right[0]), aL = Math.atan2(left[1], left[0]);
const S_ARC14 = SPAN, S_SPAN2 = SPAN + ARC, S_ARC13 = 2 * SPAN + ARC, S_TOT = CH.n * P6;
function chainAt(s) {
  s = ((s % S_TOT) + S_TOT) % S_TOT;
  if (s < SPAN) { const f = s / SPAN; return [C13[0] + RP * right[0] + f * dv[0], C13[1] + RP * right[1] + f * dv[1]]; }
  if (s < S_SPAN2) { const a = aR + (s - S_ARC14) / REFF; return [C14[0] + RP * Math.cos(a), C14[1] + RP * Math.sin(a)]; }
  if (s < S_ARC13) { const f = (s - S_SPAN2) / SPAN; return [C14[0] + RP * left[0] - f * dv[0], C14[1] + RP * left[1] - f * dv[1]]; }
  const a = aL + (s - S_ARC13) / REFF; return [C13[0] + RP * Math.cos(a), C13[1] + RP * Math.sin(a)];
}

// ---------- state ----------
const SHIFT = 0.984;   // 25 mm stroke
const S = {
  playing: true, auto: true, f: 0.10, path: false,
  dM: 0, dI: 0, dW: 0, wI: 0, wW: 0,          // unit rotations from the CAD pose (rad) and free-running speeds (rad/s)
  lockI: true, lockW: false, cI: 0, cW: 0, corrI: 0, corrW: 0,
  t: 0, v: 0, target: 'intake', goal: 0,
  phase: 'run', tPhase: 0, motorFrac: 1, dwell: 0, blocked: false,
  rpm: { motor: 100, winch: 0, ishaft: 100, roller: 300 },
};
const T_EASE = 0.10, T_SETTLE = 0.04, T_RESUME = 0.15, SLOW = 0.15, DWELL = 5.0;
const VMAX = 7.0, ACC = 150;       // cylinder: in/s, in/s^2
const W_MOTOR = 100 / 60 * TAU;    // red cartridge, rad/s

// tooth face overlap along the shaft, for travel t (0 = retracted = intake)
const SX = GE.slider.x, IX = GE.ls36.x, WX = GE.w12.x;
const ovI = (t) => Math.min(SX[1] + t, IX[1]) - Math.max(SX[0] + t, IX[0]);
const ovW = (t) => Math.min(SX[1] + t, WX[1]) - Math.max(SX[0] + t, WX[0]);
const CONTACT_W = WX[1] - SX[0];   // moving toward the winch 12T (t decreasing), teeth touch here
const CONTACT_I = IX[0] - SX[1];   // moving back toward the intake 36T (t increasing)

const thSlider = () => GE.slider.phase + S.dM;
const reqI = () => meshTooth(thSlider(), 36, 36, PSI.MI) - GE.ls36.phase;   // dI that meshes
const reqW = () => meshTooth(thSlider(), 36, 12, PSI.MW) - GE.w12.phase;    // dW that meshes
const misI = () => wrapP(S.dI - reqI(), pitch('ls36'));
const misW = () => wrapP(S.dW - reqW(), pitch('w12'));
const TOL = 0.14;

// permanent meshes, fixed at load from the CAD tooth phases
let dLa0 = 0, dLb0 = 0, dR0 = 0, dIDL0 = 0, s0 = 0;
function initPhases() {
  S.dI = wrapP(-misI(), pitch('ls36'));   // seat the intake 36T on the slider (the CAD pose is intake mode)
  S.cI = S.dI + S.dM;
  dLa0 = wrapP(meshTooth(GE.wa12.phase, 12, 36, PSI.WL) - GE.la36.phase, pitch('la36'));
  dLb0 = wrapP(meshTooth(GE.wb12.phase, 12, 36, PSI.WL) - GE.lb36.phase, pitch('lb36'));
  // chain: seat the pins in the intake-shaft sprocket gaps, then turn the idler sprocket to match
  const g13 = GE.sp13.phase + PI / NT;
  s0 = S_ARC13 + REFF * wrapP(g13 - aL, TAU / NT);
  s0 = ((s0 % P6) + P6) % P6;
  // a pin on the idler arc: angle aR + (s - S_ARC14)/REFF, for s = s0 + k*P6 inside the arc
  const k = Math.ceil((S_ARC14 - s0) / P6), sp = s0 + k * P6;
  const aPin = aR + (sp - S_ARC14) / REFF;
  dIDL0 = wrapP(aPin - (GE.sp14.phase + PI / NT), TAU / NT);
  dR0 = wrapP(meshTooth(GE.idl36.phase + dIDL0, 36, 12, PSI.IR) - GE.r12.phase, pitch('r12'));
}

function requestMode(m) {
  if (m === S.target && S.phase === 'run') return;
  S.target = m; S.goal = m === 'lift' ? -SHIFT : 0;
  if (S.phase === 'run') { S.phase = 'ease'; S.tPhase = 0; }
  S.dwell = 0;
  syncButtons();
}

function step(dtv) {
  const dt = dtv * S.f;   // real seconds
  S.tPhase += dt;
  if (S.phase === 'ease') {
    S.motorFrac = Math.max(SLOW, 1 - (1 - SLOW) * S.tPhase / T_EASE);
    if (S.tPhase >= T_EASE) { S.phase = 'stroke'; S.tPhase = 0; }
  } else if (S.phase === 'stroke') {
    S.motorFrac = SLOW;
    const d = S.goal - S.t;
    const want = Math.sign(d) * Math.min(VMAX, Math.sqrt(2 * ACC * Math.abs(d)));
    S.v += Math.max(-ACC * dt, Math.min(ACC * dt, want - S.v));
    let tn = S.t + S.v * dt;
    S.blocked = false;
    // tooth-on-tooth: the gear stops against the other gear's teeth until a gap lines up
    if (S.v < 0 && S.t >= CONTACT_W && tn < CONTACT_W && !S.lockW && Math.abs(misW()) > TOL * pitch('w12')) { tn = CONTACT_W; S.v = 0; S.blocked = true; }
    if (S.v > 0 && S.t <= CONTACT_I && tn > CONTACT_I && !S.lockI && Math.abs(misI()) > TOL * pitch('ls36')) { tn = CONTACT_I; S.v = 0; S.blocked = true; }
    // end of stroke: the piston bottoms out at the goal
    if (!S.blocked && (Math.sign(S.goal - tn) !== Math.sign(d) || Math.abs(S.goal - tn) < 5e-4)) { tn = S.goal; S.v = 0; S.phase = 'settle'; S.tPhase = 0; }
    S.t = tn;
  } else if (S.phase === 'settle') {
    if (S.tPhase >= T_SETTLE) { S.phase = 'resume'; S.tPhase = 0; }
  } else if (S.phase === 'resume') {
    S.motorFrac = SLOW + (1 - SLOW) * Math.min(1, S.tPhase / T_RESUME);
    if (S.tPhase >= T_RESUME) { S.phase = 'run'; S.motorFrac = 1; }
  } else if (S.auto) {
    S.dwell += dtv;
    if (S.dwell > DWELL) requestMode(S.target === 'lift' ? 'intake' : 'lift');
  }

  const wM = W_MOTOR * S.motorFrac;
  const dM0 = S.dM, dI0 = S.dI, dW0 = S.dW;
  S.dM += wM * dt;
  // engagement follows the tooth overlap
  const eI = ovI(S.t) > 0.004, eW = ovW(S.t) > 0.004;
  if (eI && !S.lockI) { const m = misI(); S.corrI = m; S.cI = S.dI - m + S.dM; S.lockI = true; }
  if (!eI && S.lockI) { S.lockI = false; S.wI = -wM; }
  if (eW && !S.lockW) { const m = misW(); S.corrW = m; S.cW = (S.dW - m) + 3 * S.dM; S.lockW = true; }
  if (!eW && S.lockW) { S.lockW = false; S.wW = -3 * wM; }
  const k = Math.exp(-dt / 0.03);
  if (S.lockI) { S.corrI *= k; S.dI = S.cI - S.dM + S.corrI; }
  else { S.wI *= Math.exp(-dt / 0.25); S.dI += S.wI * dt; }   // intake coasts down
  if (S.lockW) { S.corrW *= k; S.dW = S.cW - 3 * S.dM + S.corrW; }
  else { S.wW *= Math.exp(-dt / 0.05); S.dW += S.wW * dt; }   // cascade motors hold the winch
  if (dt > 0) {
    const toRpm = (a) => Math.abs(a) / dt / TAU * 60;
    const sm = (o, n) => o + (n - o) * Math.min(1, dt / 0.04);
    S.rpm.motor = sm(S.rpm.motor, toRpm(S.dM - dM0));
    S.rpm.ishaft = sm(S.rpm.ishaft, toRpm(S.dI - dI0));
    S.rpm.roller = 3 * S.rpm.ishaft;
    S.rpm.winch = sm(S.rpm.winch, toRpm(S.dW - dW0));
  }
}

const tmpM = new THREE.Matrix4();
function pose() {
  if (!units.M) return;
  const rot = (n, a) => { if (units[n]) units[n].pivot.rotation.x = a; };
  rot('M', S.dM); rot('slider', S.dM);
  if (units.slider) units.slider.outer.position.x = S.t;
  if (units.fork) units.fork.outer.position.x = S.t;
  rot('I', S.dI); rot('W', S.dW); rot('W8', S.dW);
  rot('La', dLa0 - S.dW / 3); rot('Lb', dLb0 - S.dW / 3);
  rot('IDL', dIDL0 + S.dI);
  const dR = dR0 - 3 * S.dI;
  rot('R', dR);
  rot('R2', meshTooth(GE.rl36.phase + dR, 36, 12, PSI.RR2) - GE.r2_12.phase);   // idler 12T beside the roller's 36T
  // chain: pins advance one pitch per sprocket tooth
  const s = s0 + REFF * S.dI;
  for (let k = 0; k < CH.n; k++) {
    const a = chainAt(s + k * P6), b = chainAt(s + (k + 1) * P6);
    const A = CH.ccw ? a : b, B = CH.ccw ? b : a;
    let uy = B[0] - A[0], uz = B[1] - A[1]; const L = Math.hypot(uy, uz); uy /= L; uz /= L;
    tmpM.set(1, 0, 0, 0,
             0, uy, -uz, A[0],
             0, uz, uy, A[1],
             0, 0, 0, 1);
    chainMesh.setMatrixAt(k, tmpM);
  }
  chainMesh.instanceMatrix.needsUpdate = true;
}

// ---------- power-path tint ----------
const LIFT_U = ['M', 'slider', 'W', 'W8', 'La', 'Lb'], INTAKE_U = ['M', 'slider', 'I', 'IDL', 'R', 'chain'];
let COL = {}, lastKey = '';
function readColors() {
  COL = { lift: new THREE.Color(cssv('--cascade')), intake: new THREE.Color(cssv('--intake')) };
  scene.background = new THREE.Color(cssv('--stage'));
}
function modeKey() { return S.lockW ? 'lift' : S.lockI ? 'intake' : 'neutral'; }
function highlight() {
  const key = modeKey() + (S.path ? '+' : '');
  if (key === lastKey) return;
  lastKey = key;
  const mk = modeKey(), on = S.path && mk !== 'neutral' ? (mk === 'lift' ? LIFT_U : INTAKE_U) : [];
  for (const m of Object.values(unitMats)) {
    const lit = on.includes(m.userData.unit);
    m.emissive.copy(lit ? COL[mk] : new THREE.Color(0));
    m.emissiveIntensity = lit ? 0.32 : 0;
  }
  const chip = $('chip');
  chip.dataset.mode = mk;
  chip.textContent = mk === 'lift' ? 'Cascade' : mk === 'intake' ? 'Intake' : 'Neutral';
}

// ---------- UI ----------
function syncButtons() {
  $('m-lift').setAttribute('aria-pressed', String(S.target === 'lift'));
  $('m-intake').setAttribute('aria-pressed', String(S.target === 'intake'));
}
$('m-lift').addEventListener('click', () => { S.auto = false; $('auto').checked = false; requestMode('lift'); if (!S.playing) togglePlay(); });
$('m-intake').addEventListener('click', () => { S.auto = false; $('auto').checked = false; requestMode('intake'); if (!S.playing) togglePlay(); });
$('auto').addEventListener('change', (e) => { S.auto = e.target.checked; S.dwell = 0; });
$('lbls').addEventListener('change', (e) => stage.classList.toggle('hide-labels', !e.target.checked));
$('path').addEventListener('change', (e) => { S.path = e.target.checked; highlight(); });
$('ctx').addEventListener('change', (e) => { for (const m of ctxMeshes) m.visible = e.target.checked; });
$('speed').addEventListener('input', (e) => { S.f = parseFloat(e.target.value); $('speedv').textContent = S.f.toFixed(2) + '× real'; });
function togglePlay() { S.playing = !S.playing; $('play').textContent = S.playing ? 'Pause' : 'Play'; $('play').setAttribute('aria-pressed', String(S.playing)); }
$('play').addEventListener('click', togglePlay);

// camera offsets from each view's target (inches); scaled up on narrow screens so the whole PTO stays in frame
const VIEWS = {
  iso: { off: new THREE.Vector3(9.0, -12.3, 7.0), tgt: new THREE.Vector3(-0.8, 5.0, 9.85) },
  side: { off: new THREE.Vector3(1.6, -15.5, 2.2), tgt: new THREE.Vector3(-0.8, 5.0, 10.2) },
  face: { off: new THREE.Vector3(11.5, 0.01, 0.3), tgt: new THREE.Vector3(-0.5, 4.75, 10.15) },
};
let camTween = null, view = 'iso';
const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const fitK = () => Math.pow(Math.max(1, 1.55 / camera.aspect), 0.85);
function setView(name, instant = false) {
  view = name;
  document.querySelectorAll('.views button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  const V = VIEWS[name], to = V.tgt.clone().add(V.off.clone().multiplyScalar(fitK()));
  if (instant) { camera.position.copy(to); controls.target.copy(V.tgt); return; }
  camTween = { from: camera.position.clone(), fromT: controls.target.clone(), to, toT: V.tgt.clone(), t: 0 };
}
// in the gear-plane view, cut away everything in front of the sliding gear so its mesh is visible
const XPLANE = renderer.clippingPlanes[1];
const allLabels = [];
function applyCut() {
  const cut = view === 'face' ? GE.slider.x[1] + S.t + 0.06 : BOX1[0];
  XPLANE.constant = cut;
  for (const o of allLabels) { o.getWorldPosition(_lp); o.visible = view !== 'face' || (o.userData.face && _lp.x <= cut + 0.3); }
}
const _lp = new THREE.Vector3();
document.querySelectorAll('.views button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

const fmt = (n) => Math.round(n).toString();
function updateReadout() {
  highlight();
  $('r-motor').textContent = fmt(S.rpm.motor);
  $('r-winch').textContent = fmt(S.rpm.winch);
  $('r-ishaft').textContent = fmt(S.rpm.ishaft);
  $('r-roller').textContent = fmt(S.rpm.roller);
  const tw = $('t-winch'), tr = $('t-roller');
  tw.textContent = S.lockW ? 'driven' : 'held'; tw.className = 'tag' + (S.lockW ? ' on-lift' : '');
  tr.textContent = S.lockI ? 'driven' : S.rpm.roller > 3 ? 'coasting' : 'off'; tr.className = 'tag' + (S.lockI ? ' on-intake' : '');
  $('r-travel').textContent = Math.abs(S.t).toFixed(3);
  let cyl = S.t < -SHIFT / 2 ? 'extended' : 'retracted';
  if (S.phase === 'stroke') cyl = S.blocked ? 'stopped on a tooth' : S.v < 0 ? 'extending' : 'retracting';
  $('r-cyl').textContent = cyl;
  const mk = modeKey();
  $('hudsub').textContent = mk === 'lift' ? `winch ${fmt(S.rpm.winch)} rpm` : mk === 'intake' ? `top roller ${fmt(S.rpm.roller)} rpm` : S.blocked ? 'tooth on tooth, waiting for a gap' : 'neither output connected';
  let st = 0;
  if (S.phase === 'ease') st = 1;
  else if (S.phase === 'stroke') st = (S.blocked || (S.target === 'lift' ? S.t < CONTACT_W + 0.02 : S.t > CONTACT_I - 0.02)) ? 3 : 2;
  else if (S.phase === 'settle') st = 3;
  else if (S.phase === 'resume') st = 4;
  document.querySelectorAll('#steps li').forEach((li) => li.classList.toggle('now', Number(li.dataset.step) === st));
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  labelR.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (!camTween && units.M === undefined) setView(view, true);
}
new ResizeObserver(resize).observe(stage);
const mq = window.matchMedia('(prefers-color-scheme: dark)');
const reTheme = () => { readColors(); lastKey = ''; highlight(); };
mq.addEventListener?.('change', reTheme);
new MutationObserver(reTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  S.auto = false; $('auto').checked = false; S.playing = false; $('play').textContent = 'Play'; $('play').setAttribute('aria-pressed', 'false');
}

readColors();
setView('iso', true);
resize();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.playing && units.M) { step(dt); pose(); }
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt / 0.7);
    const e = ease(camTween.t);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  applyCut();
  renderer.render(scene, camera);
  labelR.render(scene, camera);
  requestAnimationFrame(frame);
}
const STILL = /[?&]still/.test(location.search);   // test hook: render only on request
if (!STILL) requestAnimationFrame(frame);
setInterval(() => { if (units.M) updateReadout(); }, 100);
function renderOnce() { controls.update(); applyCut(); renderer.render(scene, camera); labelR.render(scene, camera); }

loadMesh().then((buf) => {
  build(buf);
  addLabels();
  initPhases();
  pose();
  updateReadout();
  msg.hidden = true;
}).catch((e) => { msg.textContent = 'The CAD parts could not load: ' + e.message; console.error(e); });
window.__pto = { S, requestMode, setView, step, pose, units, META, misI, misW, ovI, ovW, renderOnce, camera, controls, updateReadout, CENTER, THREE };
</script>

</body>
</html>
